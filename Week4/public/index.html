<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Welcome to Deakin Library</title>

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Materialize CSS -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


<nav>
    <div class="nav-wrapper navbar-size">

        <a href="#" class="brand-logo">
            Book Library
        </a>

    </div>
</nav>



<main class="main-body">


<div class="container">


    <div class="row">

        <div class="col s12 center-align">

            <h1 id="heading">
                Welcome to Deakin Library
            </h1>

            <p class="flow-text">
                "Books are a uniquely portable magic"
            </p>

        </div>


        <div class="col s12 center-align">

            <a class="waves-effect waves-light btn click-me-button modal-trigger"
            id="clickMeButton"
            data-target="modal1">

                <i class="material-icons left">
                    add
                </i>

                Add User

            </a>

        </div>


    </div>



    <!-- Dynamic Cards will load here -->

    <div class="row" id="card-section">

    </div>



</div>



<!-- Modal -->

<div id="modal1" class="modal modal-fixed-footer">


    <div class="modal-content">

        <h4>User Details</h4>


        <div class="row">


            <div class="input-field col s6">

                <input id="first_name" type="text">

                <label for="first_name">
                    First Name
                </label>

            </div>



            <div class="input-field col s6">

                <input id="last_name" type="text">

                <label for="last_name">
                    Last Name
                </label>

            </div>



            <div class="input-field col s12">

                <input id="email" type="email">

                <label for="email">
                    Email
                </label>

            </div>



        </div>


    </div>



    <div class="modal-footer">

        <a class="waves-effect waves-light btn"
        id="formSubmit">

            Submit

        </a>


    </div>


</div>



</main>




<!-- jQuery -->

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


<!-- Materialize JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>


<!-- Custom JS -->

<script src="js/scripts.js"></script>



</body>

</html>
