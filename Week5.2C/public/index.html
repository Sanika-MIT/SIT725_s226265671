<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Books Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            background-color: #176b87;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #12556b;
        }

        #booksList {
            margin-top: 25px;
            width: 500px;
        }

        .book-item {
            padding: 8px;
            cursor: pointer;
            border: 1px solid #ccc;
        }

        .book-item:hover {
            background-color: #eeeeee;
        }

        #bookDetails {
            margin-top: 30px;
            width: 500px;
        }

        #bookDetails p {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <h1>Books Catalogue developed by s226265671</h1>

    <p>
        Click the button below to get all book items from the server:
    </p>

    <button id="getBooksButton">Get all books</button>

    <div id="booksList"></div>

    <div id="bookDetails"></div>

    <script>

        const getBooksButton = document.getElementById('getBooksButton');
        const booksList = document.getElementById('booksList');
        const bookDetails = document.getElementById('bookDetails');

        // Get all books when button is clicked
        getBooksButton.addEventListener('click', async () => {

            try {

                const response = await fetch('/api/books');

                const result = await response.json();

                booksList.innerHTML = '';
                bookDetails.innerHTML = '';

                result.data.forEach(book => {

                    const bookItem = document.createElement('div');

                    bookItem.classList.add('book-item');

                    bookItem.textContent =
                        `${book.title} ${book.price.$numberDecimal} AUD`;

                    bookItem.addEventListener('click', () => {
                        getBookById(book.id);
                    });

                    booksList.appendChild(bookItem);
                });

            } catch (error) {

                console.error('Error fetching books:', error);

                booksList.innerHTML =
                    '<p>Error loading books.</p>';
            }
        });


        // Get one book by ID
        async function getBookById(id) {

            try {

                const response = await fetch(`/api/books/${id}`);

                const result = await response.json();

                const book = result.data;

                bookDetails.innerHTML = `
                    <p><strong>Title:</strong> ${book.title}</p>
                    <p><strong>Author:</strong> ${book.author}</p>
                    <p><strong>Year:</strong> ${book.year}</p>
                    <p><strong>Genre:</strong> ${book.genre}</p>
                    <p><strong>Summary:</strong> ${book.summary}</p>
                    <p><strong>Price (AUD):</strong> ${book.price.$numberDecimal}</p>
                `;

            } catch (error) {

                console.error('Error fetching book:', error);

                bookDetails.innerHTML =
                    '<p>Error loading book details.</p>';
            }
        }

    </script>

</body>

</html>
